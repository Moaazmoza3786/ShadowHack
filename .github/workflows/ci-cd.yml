name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Code Quality & Testing
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov pytest-xdist pytest-flask
      
      - name: Run linting
        run: |
          pip install flake8 pylint black isort
          black --check backend/ || true
          isort --check-only backend/ || true
          flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics || true
      
      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          FLASK_ENV: testing
        run: |
          pytest backend/test_comprehensive.py -v --cov=backend --cov-report=xml --cov-report=html -x
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
      
      - name: Run security checks
        run: |
          pip install bandit safety
          bandit -r backend/ -f json -o bandit-report.json || echo "Security issues found, check report"
          safety check --json || echo "Dependency vulnerabilities found, check report"

  # Build Docker image
  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to staging
  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts
      
      - name: Deploy to staging
        run: |
          ssh -i ~/.ssh/deploy_key deployer@${{ secrets.STAGING_HOST }} << 'EOF'
          cd /app/shadowhack
          git pull origin develop
          docker-compose pull
          docker-compose up -d
          docker-compose exec -T backend flask db upgrade
          EOF
      
      - name: Run staging tests
        run: |
          ssh -i ~/.ssh/deploy_key deployer@${{ secrets.STAGING_HOST }} << 'EOF'
          cd /app/shadowhack
          docker-compose exec -T backend pytest --tb=short
          EOF

  # Deploy to production
  deploy-production:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.PROD_HOST }} >> ~/.ssh/known_hosts
      
      - name: Pre-deployment checks
        run: |
          echo "Running pre-deployment checks..."
          echo "Version: ${{ github.sha }}"
          echo "Branch: ${{ github.ref }}"
      
      - name: Deploy to production
        run: |
          ssh -i ~/.ssh/deploy_key deployer@${{ secrets.PROD_HOST }} << 'EOF'
          cd /app/shadowhack
          # Backup current state
          docker-compose exec -T postgres pg_dump -U postgres shadowhack > backup_$(date +%s).sql
          # Update and start
          git pull origin main
          docker-compose pull
          docker-compose up -d
          docker-compose exec -T backend flask db upgrade
          EOF
      
      - name: Post-deployment verification
        run: |
          ssh -i ~/.ssh/deploy_key deployer@${{ secrets.PROD_HOST }} << 'EOF'
          cd /app/shadowhack
          # Wait for services to be healthy
          sleep 30
          # Run health checks
          docker-compose exec -T backend curl -f http://localhost:5000/health || exit 1
          EOF
      
      - name: Notify Slack on success
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: success
          text: "✅ Production deployment successful\nVersion: ${{ github.sha }}\nBranch: ${{ github.ref }}"
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
      
      - name: Notify Slack on failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: "❌ Production deployment failed\nVersion: ${{ github.sha }}\nCheck logs for details"
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  # Security scanning
  security:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  # Lighthouse CI (for frontend performance)
  lighthouse:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          uploadArtifacts: true
          temporaryPublicStorage: true
