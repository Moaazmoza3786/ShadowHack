

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: shadowhack-db
    environment:
      POSTGRES_DB: ${DB_NAME:-shadowhack}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changepassword123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shadowhack-network
    restart: unless-stopped

  # Redis Cache Service
  redis:
    image: redis:7-alpine
    container_name: shadowhack-cache
    command: redis-server --requirepass ${REDIS_PASSWORD:-changepassword123} --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changepassword123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shadowhack-network
    restart: unless-stopped

  # Backend API Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shadowhack-backend
    user: root
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - FLASK_DEBUG=${FLASK_DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-changepassword123}@postgres:5432/${DB_NAME:-shadowhack}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changepassword123}@redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - HACKERONE_API_KEY=${HACKERONE_API_KEY:-}
      - BUGCROWD_API_KEY=${BUGCROWD_API_KEY:-}
      - INTIGRITI_API_KEY=${INTIGRITI_API_KEY:-}
      - LINKEDIN_CLIENT_ID=${LINKEDIN_CLIENT_ID:-}
      - LINKEDIN_CLIENT_SECRET=${LINKEDIN_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - shadowhack-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Frontend Service (React)
  frontend:
    image: node:20-alpine
    container_name: shadowhack-frontend
    working_dir: /app
    environment:
      - REACT_APP_API_URL=${BACKEND_URL:-http://backend:5000}
      - NODE_ENV=development
    volumes:
      - ./study-hub-react:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - shadowhack-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --spider http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    command: sh -c "npm install --include=dev && npx vite --host"

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: shadowhack-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - shadowhack-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Ollama Local AI Server
  ollama:
    image: ollama/ollama:latest
    container_name: shadowhack-ai
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - shadowhack-network
    restart: unless-stopped
    environment:
      - OLLAMA_KEEP_ALIVE=24h

  # Ollama Model Initializer (Auto-pulls the model on startup)
  ollama-init:
    image: curlimages/curl
    container_name: shadowhack-ai-init
    depends_on:
      - ollama
    networks:
      - shadowhack-network
    command: >
      sh -c '
      echo "Waiting for Ollama to be available...";
      sleep 5;
      while ! curl -s http://ollama:11434/api/tags > /dev/null; do
        sleep 5;
      done;
      echo "Ollama is up. Pulling qwen2.5-coder:7b model (This might take a while if not cached)...";
      curl -s -X POST http://ollama:11434/api/pull -d "{\"name\": \"qwen2.5-coder:7b\"}";
      echo "Model pull complete!";
      '

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ollama_data:
    driver: local

networks:
  shadowhack-network:
    driver: bridge
